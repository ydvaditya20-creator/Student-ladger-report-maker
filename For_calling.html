<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Google Sheet Dialer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 12px;
            background-color: #f4f6f9;
        }
        h3 {
            color: #222;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .paste-box {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 2px dashed #0066cc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #004499;
            background-color: #f0f8ff;
        }
        .btn-clear {
            margin-top: 8px;
            padding: 8px 15px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .table-container {
            overflow-x: auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
                table {
            border-collapse: collapse;
            width: 100%;
            min-width: 650px;
             /* Sabhi rows aur columns ki width ek saman rakhega */
        }
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;      /* Text ko wrap hone se rokega */
            overflow: hidden;         /* Extra text ko bahar nahi nikalne dega */
            text-overflow: ellipsis;  /* Lamba text hone par aakhir mein ... dikhayega */
        }

        tr.total-row {
            background-color: #f1f3f5;
            font-weight: bold;
        }
        .duplicate-row {
            background-color: #d0ebff !important;
        }
        a.phone-link {
            color: #0066cc;
            font-weight: bold;
            text-decoration: none;
            padding: 5px 8px;
            background-color: rgba(255, 255, 255, 0.85);
            border: 1px solid #b3d7ff;
            border-radius: 4px;
            display: inline-block;
            white-space: nowrap;
        }
        a.phone-link:active {
            background-color: #cce5ff;
        }

<!-- CSS Styling for Toggle & Cards -->
<style>
    .controls-bar {
        margin: 15px 0;
        display: flex;
        gap: 10px;
    }
    .toggle-btn {
        padding: 8px 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }
    .toggle-btn:hover {
        background-color: #0056b3;
    }

    /* Card View Grid Layout */
    .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 15px;
        margin-top: 15px;
    }
    .data-card {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 15px;
        background-color: #ffffff;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .data-card.duplicate-row {
        background-color: #fff3cd; /* Duplicate highlight */
        border-color: #ffeeba;
    }
    .data-card.total-row {
        background-color: #e2e3e5;
        font-weight: bold;
        border: 2px solid #6c757d;
    }
    .card-row {
        margin-bottom: 8px;
        font-size: 14px;
        border-bottom: 1px dashed #eee;
        padding-bottom: 4px;
    }
    .card-row:last-child {
        border-bottom: none;
        margin-bottom: 0;
    }
    .card-label {
        font-weight: bold;
        color: #555;
        margin-right: 5px;
    }
</style>

</head>
<body>

<!-- HTML Button (Clear button ke paas lagayein) -->
<div class="controls-bar">
    <button type="button" onclick="clearData()">Clear Data</button>
    <button type="button" id="viewToggleBtn" class="toggle-btn" onclick="toggleView()">📇 Card View Dekhein</button>
</div>


   


    <h3>Google Sheet Data Paste Karein</h3>
    
    <div class="paste-box">
        <textarea id="pasteInput" placeholder="Google Sheet se data Copy karke yahan Paste karein..."></textarea>
        <button class="btn-clear" onclick="clearData()">Clear Karein</button>
    </div>

    <div class="table-container" id="tableContainer"></div>

    <!-- JavaScript file ko yahan link kiya gaya hai -->
    <script>

const pasteInput = document.getElementById('pasteInput');
const viewToggleBtn = document.getElementById('viewToggleBtn');

// Storage ke liye keys
const STORAGE_ROWS_KEY = 'savedTableRowsData';
const STORAGE_TEXT_KEY = 'savedPasteInputText';
const STORAGE_VIEW_KEY = 'savedViewMode';

// Current View Mode ('table' ya 'card')
let currentView = localStorage.getItem(STORAGE_VIEW_KEY) || 'table';

// Page load hone par purana saved data aur view mode wapas dikhayein
window.addEventListener('DOMContentLoaded', function() {
    updateToggleButtonText();

    const savedText = localStorage.getItem(STORAGE_TEXT_KEY);
    const savedRows = localStorage.getItem(STORAGE_ROWS_KEY);

    if (savedText) {
        pasteInput.value = savedText;
    }

    if (savedRows) {
        try {
            const parsedRows = JSON.parse(savedRows);
            renderData(parsedRows);
        } catch (error) {
            console.error("Saved data load karne mein error:", error);
        }
    }
});

// View toggle karne ka function
function toggleView() {
    currentView = (currentView === 'table') ? 'card' : 'table';
    localStorage.setItem(STORAGE_VIEW_KEY, currentView);
    updateToggleButtonText();

    const savedRows = localStorage.getItem(STORAGE_ROWS_KEY);
    if (savedRows) {
        renderData(JSON.parse(savedRows));
    }
}

function updateToggleButtonText() {
    if (!viewToggleBtn) return;
    if (currentView === 'table') {
        viewToggleBtn.textContent = "📇 Card View Dekhein";
    } else {
        viewToggleBtn.textContent = "📊 Table View Dekhein";
    }
}

// Paste event
pasteInput.addEventListener('paste', function(e) {
    e.preventDefault();
    const clipboardData = e.clipboardData || window.clipboardData;
    const htmlData = clipboardData.getData('text/html');
    const plainText = clipboardData.getData('text/plain');

    this.value = plainText;
    localStorage.setItem(STORAGE_TEXT_KEY, plainText);

    if (htmlData && htmlData.includes('<table')) {
        processHtmlData(htmlData);
    } else if (plainText.trim()) {
        processPlainData(plainText);
    }
});

// Clear button dabane par screen aur Local Storage dono saaf karein
function clearData() {
    pasteInput.value = "";
    document.getElementById('tableContainer').innerHTML = "";
    localStorage.removeItem(STORAGE_ROWS_KEY);
    localStorage.removeItem(STORAGE_TEXT_KEY);
}

// HTML table data process karein
function processHtmlData(html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const trs = Array.from(doc.querySelectorAll('tr'));
    const parsedRows = [];

    for (let i = 4; i < trs.length; i++) {
        const cells = Array.from(trs[i].querySelectorAll('td, th'));
        const rowValues = cells.map(c => c.textContent.trim());

        if (rowValues.every(val => val === "")) continue;

        let greenBg = "";
        const trBg = trs[i].style.backgroundColor || trs[i].getAttribute('bgcolor');
        if (isGreenColor(trBg)) {
            greenBg = trBg;
        } else {
            for (let cell of cells) {
                const cellBg = cell.style.backgroundColor || cell.getAttribute('bgcolor');
                if (isGreenColor(cellBg)) {
                    greenBg = cellBg;
                    break;
                }
            }
        }

        parsedRows.push({ values: rowValues, greenBg: greenBg });

        const isTotalRow = rowValues.some(cell => cell.toLowerCase().includes('total'));
        if (isTotalRow) break;
    }

    localStorage.setItem(STORAGE_ROWS_KEY, JSON.stringify(parsedRows));
    renderData(parsedRows);
}

// Plain text process karein
function processPlainData(text) {
    const lines = text.split(/\r?\n/);
    const parsedRows = [];

    for (let i = 4; i < lines.length; i++) {
        const rowValues = lines[i].split('\t').map(v => v.trim());
        if (rowValues.every(val => val === "")) continue;

        parsedRows.push({ values: rowValues, greenBg: "" });

        const isTotalRow = rowValues.some(cell => cell.toLowerCase().includes('total'));
        if (isTotalRow) break;
    }

    localStorage.setItem(STORAGE_ROWS_KEY, JSON.stringify(parsedRows));
    renderData(parsedRows);
}

// Green color check karein
function isGreenColor(colorStr) {
    if (!colorStr) return false;
    const c = colorStr.toLowerCase().trim();
    if (c === 'transparent' || c === 'white' || c === '#ffffff' || c === 'rgb(255, 255, 255)') return false;
    if (c.includes('green')) return true;

    const rgbMatch = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (rgbMatch) {
        const r = parseInt(rgbMatch[1]);
        const g = parseInt(rgbMatch[2]);
        const b = parseInt(rgbMatch[3]);
        return (g > r + 10 && g > b + 10);
    }

    if (c.startsWith('#') && (c.length === 7 || c.length === 4)) {
        let hex = c.slice(1);
        if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
        const r = parseInt(hex.substr(0, 2), 16);
        const g = parseInt(hex.substr(2, 2), 16);
        const b = parseInt(hex.substr(4, 2), 16);
        return (g > r + 10 && g > b + 10);
    }

    return false;
}

// Main Render Router (Table ya Card chunein)
function renderData(rows) {
    const container = document.getElementById('tableContainer');
    container.innerHTML = "";
    if (!rows || rows.length === 0) return;

    // Max columns calculate karein
    let actualMaxCols = 6;
    rows.forEach(rowObj => {
        for (let c = rowObj.values.length - 1; c >= 0; c--) {
            if (rowObj.values[c] !== "") {
                if (c + 1 > actualMaxCols) actualMaxCols = c + 1;
                break;
            }
        }
    });

    // Duplicate names count karein (Column D / index 3)
    const nameCounts = {};
    rows.forEach(rowObj => {
        const isTotalRow = rowObj.values.some(cell => cell.toLowerCase().includes('total'));
        if (!isTotalRow) {
            const name = String(rowObj.values[3] || "").trim().toLowerCase();
            if (name !== "") {
                nameCounts[name] = (nameCounts[name] || 0) + 1;
            }
        }
    });

    if (currentView === 'card') {
        renderCards(rows, actualMaxCols, nameCounts, container);
    } else {
        renderTable(rows, actualMaxCols, nameCounts, container);
    }
}

// 1. TABLE VIEW RENDERER
function renderTable(rows, actualMaxCols, nameCounts, container) {
    const table = document.createElement('table');

    rows.forEach(rowObj => {
        const row = rowObj.values;
        const tr = document.createElement('tr');
        const isTotalRow = row.some(cell => cell.toLowerCase().includes('total'));

        if (isTotalRow) {
            tr.classList.add('total-row');
        } else if (rowObj.greenBg !== "") {
            tr.style.backgroundColor = rowObj.greenBg;
        } else {
            const currentName = String(row[3] || "").trim().toLowerCase();
            if (currentName !== "" && nameCounts[currentName] > 1) {
                tr.classList.add('duplicate-row');
            }
        }

        for (let colIndex = 0; colIndex < actualMaxCols; colIndex++) {
            const td = document.createElement('td');
            const cellValue = row[colIndex] !== undefined ? String(row[colIndex]).trim() : "";

            if (!isTotalRow && (colIndex === 4 || colIndex === 5) && cellValue !== "") {
                const cleanNumber = cellValue.replace(/[^0-9+]/g, '');
                if (cleanNumber.length >= 5) {
                    const link = document.createElement('a');
                    link.href = `tel:${cleanNumber}`;
                    link.className = 'phone-link';
                    link.textContent = `📞 ${cellValue}`;
                    td.appendChild(link);
                } else {
                    td.textContent = cellValue;
                }
            } else {
                td.textContent = cellValue;
            }

            tr.appendChild(td);
        }

        table.appendChild(tr);
    });

    container.appendChild(table);
}

// 2. CARD VIEW RENDERER
function renderCards(rows, actualMaxCols, nameCounts, container) {
    const grid = document.createElement('div');
    grid.className = 'card-grid';

    // Pehli row ko headers maan kar labels nikal lein
    const headers = rows[0] ? rows[0].values : [];

    rows.forEach((rowObj, rowIndex) => {
        const row = rowObj.values;
        const isTotalRow = row.some(cell => cell.toLowerCase().includes('total'));

        if (rowIndex === 0 && !isTotalRow) return;

        const card = document.createElement('div');
        card.className = 'data-card';

        if (isTotalRow) {
            card.classList.add('total-row');
        } else if (rowObj.greenBg !== "") {
            card.style.backgroundColor = rowObj.greenBg;
        } else {
            const currentName = String(row[3] || "").trim().toLowerCase();
            if (currentName !== "" && nameCounts[currentName] > 1) {
                card.classList.add('duplicate-row');
            }
        }

        for (let colIndex = 0; colIndex < actualMaxCols; colIndex++) {
            const cellValue = row[colIndex] !== undefined ? String(row[colIndex]).trim() : "";
            if (cellValue === "") continue;

            const rowDiv = document.createElement('div');
            rowDiv.className = 'card-row';

            const labelSpan = document.createElement('span');
            labelSpan.className = 'card-label';
            const headerName = headers[colIndex] ? headers[colIndex] : `Col ${colIndex + 1}`;
            labelSpan.textContent = isTotalRow ? "" : `${headerName}: `;
            rowDiv.appendChild(labelSpan);

            if (!isTotalRow && (colIndex === 4 || colIndex === 5)) {
                const cleanNumber = cellValue.replace(/[^0-9+]/g, '');
                if (cleanNumber.length >= 5) {
                    const link = document.createElement('a');
                    link.href = `tel:${cleanNumber}`;
                    link.className = 'phone-link';
                    link.textContent = `📞 ${cellValue}`;
                    rowDiv.appendChild(link);
                } else {
                    rowDiv.appendChild(document.createTextNode(cellValue));
                }
            } else {
                rowDiv.appendChild(document.createTextNode(cellValue));
            }

            card.appendChild(rowDiv);
        }

        grid.appendChild(card);
    });

    container.appendChild(grid);
}


</script>


</body>
</html>
